name: Build automatique sur le PC
on:
  push:
  workflow_dispatch:
jobs:
  local-build:
    runs-on: windows-native
    steps:
      - uses: actions/checkout@v4
      - name: DÃ©tection, tests et compilation
        shell: powershell
        run: G:\DevServer\builder\run-build-isolated.ps1 -Project 'tvflowV2_release' -GitHubRepository 'bobcatfr63/tvflowV2_release'
      - uses: actions/upload-artifact@v4
        with:
          name: tvflowV2_release-${{ github.sha }}
          path: local-output/*
          if-no-files-found: ignore
